<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toodo Admin</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#14151f;
    --panel:#1c1d2b;
    --panel-2:#23243c;
    --border:#2c2d3f;
    --text:#eceefb;
    --text-dim:#8d8fa8;
    --accent:#8b83ff;
    --accent-2:#7c6dff;
    --danger:#ff6f8a;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{max-width:920px; margin:0 auto; padding:28px 20px 80px;}
  h1{font-size:20px; font-weight:800; margin:0 0 4px;}
  .sub{color:var(--text-dim); font-size:13px; margin-bottom:24px;}
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:18px;
  }
  .row{display:flex; gap:8px; flex-wrap:wrap;}
  input[type=text], input[type=password]{
    flex:1;
    min-width:160px;
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:14px;
    background:var(--panel-2);
    color:var(--text);
    outline:none;
  }
  input:focus{border-color:var(--accent);}
  button{
    border:none;
    background:linear-gradient(120deg, var(--accent), var(--accent-2));
    color:#fff;
    border-radius:10px;
    padding:10px 16px;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
  }
  button.ghost{
    background:var(--panel-2);
    color:var(--text-dim);
    border:1px solid var(--border);
  }
  .msg{font-size:12.5px; color:var(--danger); margin-top:8px; min-height:1em;}
  .user-list{display:flex; flex-direction:column; gap:6px;}
  .user-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:13.5px;
  }
  .user-row:hover{border-color:var(--accent);}
  .user-row .uid{color:var(--text-dim); font-size:11.5px;}
  .detail-title{font-weight:800; font-size:15px; margin-bottom:10px;}
  .tag-chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; margin:0 6px 6px 0;}
  .todo-row{
    border-bottom:1px solid var(--border);
    padding:8px 0;
    font-size:13.5px;
  }
  .todo-row .meta{color:var(--text-dim); font-size:11.5px; margin-top:2px;}
  .hidden{display:none;}
  .empty{color:var(--text-dim); font-size:13px; padding:20px 0; text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Toodo Admin</h1>
  <div class="sub">사용자 목록 및 데이터 조회 (읽기 전용, 관리자 계정만 접근 가능)</div>

  <div class="panel" id="loginPanel">
    <div class="row">
      <input type="text" id="idInput" placeholder="관리자 아이디">
      <input type="password" id="pwInput" placeholder="비밀번호">
      <button id="loginBtn">로그인</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div class="panel hidden" id="mainPanel">
    <div class="row" style="justify-content:space-between; margin-bottom:14px;">
      <span id="whoami" style="color:var(--text-dim); font-size:13px;"></span>
      <button class="ghost" id="logoutBtn">로그아웃</button>
    </div>
    <div class="user-list" id="userList"></div>
    <div class="msg" id="listMsg"></div>
  </div>

  <div class="panel hidden" id="detailPanel">
    <button class="ghost" id="backBtn" style="margin-bottom:14px;">← 목록으로</button>
    <div class="detail-title" id="detailTitle"></div>
    <div id="detailTags" style="margin-bottom:14px;"></div>
    <div id="detailTodos"></div>
  </div>
</div>

<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyDBphE-7Qi-f8DIg_YvsgmNOTexkmp9CDk",
    authDomain: "toodo-79884.firebaseapp.com",
    projectId: "toodo-79884",
    storageBucket: "toodo-79884.firebasestorage.app",
    messagingSenderId: "312559660595",
    appId: "1:312559660595:web:fa8b39a0f6b6a5c78ebd46"
  };
  const adminApp = firebase.initializeApp(firebaseConfig, 'adminApp');
  const auth = adminApp.auth();
  const db = adminApp.firestore();
  auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);

  function sanitizeId(raw){ return (raw||'').trim().toLowerCase().replace(/[^a-z0-9_-]/g,''); }
  function idToEmail(id){ return `${id}@toodo.local`; }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  document.getElementById('loginBtn').onclick = async ()=>{
    const id = sanitizeId(document.getElementById('idInput').value);
    const pw = document.getElementById('pwInput').value;
    const msg = document.getElementById('loginMsg');
    msg.textContent = '';
    if(!id || !pw){ msg.textContent = '아이디와 비밀번호를 입력하세요.'; return; }
    try{
      await auth.signInWithEmailAndPassword(idToEmail(id), pw);
    }catch(e){ msg.textContent = '로그인에 실패했습니다: ' + e.message; }
  };
  document.getElementById('logoutBtn').onclick = ()=> auth.signOut();
  document.getElementById('backBtn').onclick = ()=>{
    document.getElementById('detailPanel').classList.add('hidden');
    document.getElementById('mainPanel').classList.remove('hidden');
  };

  auth.onAuthStateChanged(async (user)=>{
    if(user){
      document.getElementById('loginPanel').classList.add('hidden');
      document.getElementById('mainPanel').classList.remove('hidden');
      document.getElementById('whoami').textContent = `${user.displayName || user.email} 로 로그인됨`;
      loadUserList();
    } else {
      document.getElementById('loginPanel').classList.remove('hidden');
      document.getElementById('mainPanel').classList.add('hidden');
      document.getElementById('detailPanel').classList.add('hidden');
    }
  });

  async function loadUserList(){
    const listEl = document.getElementById('userList');
    const msgEl = document.getElementById('listMsg');
    listEl.innerHTML = '불러오는 중...';
    msgEl.textContent = '';
    try{
      const snap = await db.collection('user_directory').orderBy('createdAt','asc').get();
      listEl.innerHTML = '';
      if(snap.empty){
        listEl.innerHTML = '<div class="empty">등록된 사용자가 없습니다.</div>';
        return;
      }
      const docs = snap.docs;
      const counts = await Promise.all(docs.map(d=>
        db.collection('toodo_users').doc(d.id).get()
          .then(s=> (s.exists && s.data().todos) ? s.data().todos.length : 0)
          .catch(()=>'-')
      ));
      docs.forEach((doc,i)=>{
        const u = doc.data();
        const created = (u.createdAt && u.createdAt.toDate) ? u.createdAt.toDate().toLocaleDateString('ko-KR') : '-';
        const row = document.createElement('div');
        row.className = 'user-row';
        row.innerHTML = `
          <div style="cursor:pointer; flex:1;" data-role="open">
            <span>${escapeHtml(u.username || '(이름 없음)')}</span>
            <span class="uid">${doc.id} · 가입 ${created} · 할일 ${counts[i]}개</span>
          </div>
          <button class="ghost del-btn" style="padding:6px 10px; font-size:12px; margin-left:8px;">삭제</button>
        `;
        row.querySelector('[data-role="open"]').onclick = ()=> showUserDetail(doc.id, u.username);
        row.querySelector('.del-btn').onclick = (e)=>{
          e.stopPropagation();
          deleteUser(doc.id, u.username);
        };
        listEl.appendChild(row);
      });
    }catch(e){
      msgEl.textContent = '목록을 불러올 수 없습니다 (관리자 권한이 없을 수 있습니다): ' + e.message;
    }
  }

  async function deleteUser(uid, username){
    if(!confirm(`'${username}' 사용자의 할일/태그 데이터를 삭제할까요?\n(로그인 계정 자체는 지워지지 않습니다 — 완전히 없애려면 Firebase 콘솔 Authentication 탭에서 별도로 삭제하세요)`)) return;
    try{
      await db.collection('toodo_users').doc(uid).delete();
      await db.collection('user_directory').doc(uid).delete();
      loadUserList();
    }catch(e){
      alert('삭제 실패: ' + e.message);
    }
  }

  async function showUserDetail(uid, username){
    document.getElementById('mainPanel').classList.add('hidden');
    document.getElementById('detailPanel').classList.remove('hidden');
    document.getElementById('detailTitle').textContent = `${username} 의 데이터`;
    const tagsEl = document.getElementById('detailTags');
    const todosEl = document.getElementById('detailTodos');
    tagsEl.innerHTML = '불러오는 중...';
    todosEl.innerHTML = '';
    try{
      const snap = await db.collection('toodo_users').doc(uid).get();
      if(!snap.exists){
        tagsEl.innerHTML = '<div class="empty">데이터가 없습니다.</div>';
        return;
      }
      const d = snap.data();
      const tags = d.tags || [];
      const todos = d.todos || [];

      tagsEl.innerHTML = tags.length
        ? tags.map(t=>`<span class="tag-chip" style="background:${t.color}22;color:${t.color}">${escapeHtml(t.name)}</span>`).join('')
        : '<span style="color:var(--text-dim); font-size:12.5px;">태그 없음</span>';

      if(todos.length === 0){
        todosEl.innerHTML = '<div class="empty">할 일이 없습니다.</div>';
      } else {
        todosEl.innerHTML = todos.map(t=>{
          const tag = tags.find(tg=>tg.id===t.tagId);
          const rep = t.repeat && t.repeat.type !== 'none' ? t.repeat.type : null;
          return `<div class="todo-row">
            <div>${escapeHtml(t.text)}</div>
            <div class="meta">${t.date}${tag ? ' · ' + escapeHtml(tag.name) : ''}${rep ? ' · 반복: ' + rep : ''}</div>
          </div>`;
        }).join('');
      }
    }catch(e){
      tagsEl.innerHTML = `<div class="empty">불러오기 실패: ${escapeHtml(e.message)}</div>`;
    }
  }
})();
</script>
</body>
</html>
